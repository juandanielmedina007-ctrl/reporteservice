name: API - importar y verificar
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar estructura del proyecto
        if: hashFiles('reporteservice-source.zip') != ''
        run: |
          unzip -o reporteservice-source.zip -x '.github/*'
          rm reporteservice-source.zip
          chmod +x gradlew
          git config user.name "Juan Daniel Medina Garces"
          git config user.email "247490999+juandanielmedina007-ctrl@users.noreply.github.com"
          git add -A
          git commit -m "Publicar API completa por capas con pruebas y Docker"
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew test bootJar --no-daemon
